name: Kaggle Continuous Training (CT)

on:
  workflow_run:
    workflows: ["Dataset Quality Assurance"]
    types:
      - completed
  workflow_dispatch:

jobs:
  trigger_kaggle:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: pip install kaggle

      - name: Configure Kaggle Credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Inject Kaggle Username into Metadata
        run: |
          # Convert username to lowercase (Kaggle requirement)
          USERNAME=$(echo "${{ secrets.KAGGLE_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Check if secret is actually populated
          if [ -z "$USERNAME" ]; then
            echo "::error::KAGGLE_USERNAME secret is empty! Please ensure it is saved as a Repository Secret."
            exit 1
          fi
          
          sed -i "s/KAGGLE_USERNAME/$USERNAME/g" kaggle/kernel-metadata.json

      - name: Push and Execute Notebook on Kaggle
        run: |
          cd kaggle
          kaggle kernels push
